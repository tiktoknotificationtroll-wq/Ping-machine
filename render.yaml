services:
  - type: worker
    name: ping-machine-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: TARGET_USER_ID
        sync: false
      - key: GUILD_ID
        sync: false
